name: Auto Post — LUX Property Management

on:
  push:
    branches:
      - claude/n8n-social-media-automation-XpSkG
    paths:
      - 'pending-post-lux.json'

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check pending post has content
        id: check
        run: |
          CAPTION=$(jq -r '.caption' pending-post-lux.json)
          FOLDER=$(jq -r '.photo_folder' pending-post-lux.json)
          if [ -z "$CAPTION" ] || [ "$CAPTION" = "null" ] || [ -z "$FOLDER" ] || [ "$FOLDER" = "null" ]; then
            echo "pending-post-lux.json is empty — nothing to post"
            echo "has_content=false" >> $GITHUB_OUTPUT
          else
            echo "Posting: ${CAPTION:0:60}..."
            echo "Folder: $FOLDER"
            echo "has_content=true" >> $GITHUB_OUTPUT
          fi

      - name: Build credentials file
        if: steps.check.outputs.has_content == 'true'
        env:
          BUNNY_SAYULITA_KEY: ${{ secrets.BUNNY_SAYULITA_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          FB_LUX=$(jq -r '.facebook.lux_property_management.accessToken' fb-tokens.json)
          jq -n \
            --arg fb_lux "$FB_LUX" \
            --arg bunny_say "$BUNNY_SAYULITA_KEY" \
            --arg pexels "$PEXELS_API_KEY" \
            --arg tg "$TELEGRAM_BOT_TOKEN" \
            '{
              facebook: { pages: { lux_property_management: { pageId: "999599493240965", accessToken: $fb_lux } } },
              bunny: {
                storageRegionHostname: "la.storage.bunnycdn.com",
                sayulita_shared: { storageZoneName: "sayulitaandbeyond", storageApiKey: $bunny_say, cdnHostname: "sayulitaandbeyond.b-cdn.net" }
              },
              pexels: { apiKey: $pexels },
              telegram: { botToken: $tg, ownerChatId: "8609472348" }
            }' > credentials.local.json

      - name: Post to Facebook
        if: steps.check.outputs.has_content == 'true'
        env:
          PENDING_FILE: pending-post-lux.json
        run: |
          bash post-to-facebook.sh 2>&1 | tee _post-debug-lux.log
          EXIT=${PIPESTATUS[0]}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _post-debug-lux.log
          git commit -m "debug: lux post output" || true
          git push origin HEAD:claude/n8n-social-media-automation-XpSkG || true
          exit $EXIT

      - name: Clear pending post
        if: steps.check.outputs.has_content == 'true'
        run: |
          jq -n '{"caption": "", "photo_folder": "", "num_photos": 3, "property": "lux_property_management"}' > pending-post-lux.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pending-post-lux.json
          git commit -m "clear: post published to Facebook (LUX Property Management)"
          git push origin HEAD:claude/n8n-social-media-automation-XpSkG
