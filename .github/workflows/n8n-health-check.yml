name: n8n Health Check — Daily Alert

on:
  schedule:
    # Runs daily at 20:00 UTC (1pm Mexico time) — checks if anything fired today
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check n8n execution history and alert via Telegram
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          BASE="https://fullyo.app.n8n.cloud/api/v1"
          TG_CHAT="8609472348"

          # Get last 20 executions
          EXECS=$(curl -s -H "X-N8N-API-KEY: $N8N_API_KEY" \
            "$BASE/executions?limit=20&status=error")

          WORKFLOWS=$(curl -s -H "X-N8N-API-KEY: $N8N_API_KEY" \
            "$BASE/workflows?limit=30")

          # Check each workflow: when did it last run, was it successful?
          ALL_EXECS=$(curl -s -H "X-N8N-API-KEY: $N8N_API_KEY" \
            "$BASE/executions?limit=50")

          # Find the most recent execution timestamp
          LAST_RUN=$(echo "$ALL_EXECS" | jq -r '[.data[]? | .startedAt] | sort | last // "never"')

          # Count executions in last 48 hours
          CUTOFF=$(date -d '48 hours ago' -u +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -v-48H -u +%Y-%m-%dT%H:%M:%SZ)
          RECENT_COUNT=$(echo "$ALL_EXECS" | jq --arg cutoff "$CUTOFF" \
            '[.data[]? | select(.startedAt >= $cutoff)] | length')
          RECENT_ERRORS=$(echo "$ALL_EXECS" | jq --arg cutoff "$CUTOFF" \
            '[.data[]? | select(.startedAt >= $cutoff and .status == "error")] | length')

          echo "Last run: $LAST_RUN"
          echo "Executions in last 48h: $RECENT_COUNT"
          echo "Errors in last 48h: $RECENT_ERRORS"

          # Build status message
          if [ "$RECENT_COUNT" -eq 0 ]; then
            MSG="🔴 *n8n Health Alert*%0A%0ANo workflow executions in the last 48 hours.%0ALast known run: $LAST_RUN%0A%0AThe scheduler may be broken — check n8n and GitHub Actions."
            ALERT=1
          elif [ "$RECENT_ERRORS" -gt 0 ]; then
            MSG="⚠️ *n8n Health Check*%0A%0A$RECENT_ERRORS failed execution(s) in the last 48h out of $RECENT_COUNT total.%0ALast run: $LAST_RUN%0A%0ACheck _post-debug.log for details."
            ALERT=1
          else
            MSG="✅ *n8n Health Check*%0A%0AAll good — $RECENT_COUNT execution(s) in last 48h, no errors.%0ALast run: $LAST_RUN"
            ALERT=0
          fi

          # Send Telegram — always on errors, daily summary either way
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            -d "parse_mode=Markdown" \
            -d "text=${MSG}" > /dev/null

          echo "Telegram alert sent (alert=$ALERT)"

          # Fail the job if no executions so GitHub also shows red
          if [ "$RECENT_COUNT" -eq 0 ]; then
            echo "FATAL: No n8n executions in 48 hours"
            exit 1
          fi
