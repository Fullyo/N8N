name: Deploy All Fullyo Workflows to n8n

on:
  workflow_dispatch:
  push:
    branches:
      - claude/n8n-social-media-automation-XpSkG

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build credentials file from secrets
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          FB_TOKEN_SKYHOUSE: ${{ secrets.FB_TOKEN_SKYHOUSE }}
          FB_TOKEN_CASASEMPREAVANTI: ${{ secrets.FB_TOKEN_CASASEMPREAVANTI }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUNNY_SKYHOUSE_KEY: ${{ secrets.BUNNY_SKYHOUSE_KEY }}
          BUNNY_SAYULITA_KEY: ${{ secrets.BUNNY_SAYULITA_KEY }}
          BUNNY_SEMPREAVANTI_KEY: ${{ secrets.BUNNY_SEMPREAVANTI_KEY }}
          BUNNY_MOROCCANPALACE_KEY: ${{ secrets.BUNNY_MOROCCANPALACE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import json, os

          # Read MP/LUX FB tokens and Bunny MP key from fb-tokens.json (tracked in repo)
          with open('fb-tokens.json') as f:
              stored = json.load(f)

          fb_pages = stored.get('facebook', {})
          fb_mp  = fb_pages.get('moroccan_palace', {}).get('accessToken', '')
          fb_lux = fb_pages.get('lux_property_management', {}).get('accessToken', '')

          # Bunny MP key: GitHub Secret takes priority, fb-tokens.json as fallback
          bunny_mp_fallback = stored.get('bunny', {}).get('themoroccanpalace', {}).get('storageApiKey', '')
          bunny_mp = os.environ.get('BUNNY_MOROCCANPALACE_KEY', '') or bunny_mp_fallback

          creds = {
            "facebook": {
              "pages": {
                "skyhouse_sayulita":      {"pageId": "1004908006045909", "accessToken": os.environ["FB_TOKEN_SKYHOUSE"]},
                "casasempreavanti":       {"pageId": "350547805544245",  "accessToken": os.environ["FB_TOKEN_CASASEMPREAVANTI"]},
                "moroccan_palace":        {"pageId": "954938847703306",  "accessToken": fb_mp},
                "lux_property_management":{"pageId": "999599493240965",  "accessToken": fb_lux}
              }
            },
            "n8n": {"instanceUrl": "https://fullyo.app.n8n.cloud", "apiKey": os.environ["N8N_API_KEY"]},
            "anthropic": {"apiKey": os.environ["ANTHROPIC_API_KEY"]},
            "bunny": {
              "storageRegionHostname": "la.storage.bunnycdn.com",
              "skyhouse":          {"storageZoneName": "skyhousesayulita",    "storageApiKey": os.environ["BUNNY_SKYHOUSE_KEY"],    "cdnHostname": "SkyhouseSayulita.b-cdn.net"},
              "sayulita_shared":   {"storageZoneName": "sayulitaandbeyond",   "storageApiKey": os.environ["BUNNY_SAYULITA_KEY"],    "cdnHostname": "sayulitaandbeyond.b-cdn.net"},
              "casasempreavanti":  {"storageZoneName": "villassempreavanti",  "storageApiKey": os.environ["BUNNY_SEMPREAVANTI_KEY"],"cdnHostname": "VillasSempreAvanti.b-cdn.net"},
              "themoroccanpalace": {"storageZoneName": "themoroccanpalace",   "storageApiKey": bunny_mp,                            "cdnHostname": "themoroccanpalace.b-cdn.net"}
            },
            "telegram": {"botToken": os.environ["TELEGRAM_BOT_TOKEN"], "ownerChatId": "8609472348"},
            "pexels": {"apiKey": os.environ["PEXELS_API_KEY"]}
          }

          with open('credentials.local.json', 'w') as f:
              json.dump(creds, f, indent=2)

          print("credentials.local.json created")
          PYEOF

      - name: Run deploy script
        run: bash deploy-to-n8n.sh
