name: Deploy All Fullyo Workflows to n8n

on:
  workflow_dispatch:
  push:
    branches:
      - claude/n8n-social-media-automation-XpSkG

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build credentials file from secrets
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          FB_TOKEN_SKYHOUSE: ${{ secrets.FB_TOKEN_SKYHOUSE }}
          FB_TOKEN_CASASEMPREAVANTI: ${{ secrets.FB_TOKEN_CASASEMPREAVANTI }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUNNY_SKYHOUSE_KEY: ${{ secrets.BUNNY_SKYHOUSE_KEY }}
          BUNNY_SAYULITA_KEY: ${{ secrets.BUNNY_SAYULITA_KEY }}
          BUNNY_SEMPREAVANTI_KEY: ${{ secrets.BUNNY_SEMPREAVANTI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          FB_MP=$(jq -r '.facebook.pages.moroccan_palace.accessToken' credentials.local.json)
          FB_LUX=$(jq -r '.facebook.pages.lux_property_management.accessToken' credentials.local.json)
          jq -n \
            --arg n8n_key "$N8N_API_KEY" \
            --arg fb_sky "$FB_TOKEN_SKYHOUSE" \
            --arg fb_vsa "$FB_TOKEN_CASASEMPREAVANTI" \
            --arg fb_mp "$FB_MP" \
            --arg fb_lux "$FB_LUX" \
            --arg anthropic_key "$ANTHROPIC_API_KEY" \
            --arg bunny_sky "$BUNNY_SKYHOUSE_KEY" \
            --arg bunny_say "$BUNNY_SAYULITA_KEY" \
            --arg bunny_csa "$BUNNY_SEMPREAVANTI_KEY" \
            --arg tg_token "$TELEGRAM_BOT_TOKEN" \
            --arg pexels_key "$PEXELS_API_KEY" \
            '{
              facebook: {
                pages: {
                  skyhouse_sayulita: { pageId: "1004908006045909", accessToken: $fb_sky },
                  casasempreavanti: { pageId: "350547805544245", accessToken: $fb_vsa },
                  moroccan_palace: { pageId: "954938847703306", accessToken: $fb_mp },
                  lux_property_management: { pageId: "999599493240965", accessToken: $fb_lux }
                }
              },
              n8n: { instanceUrl: "https://fullyo.app.n8n.cloud", apiKey: $n8n_key },
              anthropic: { apiKey: $anthropic_key },
              bunny: {
                storageRegionHostname: "la.storage.bunnycdn.com",
                skyhouse: { storageZoneName: "skyhousesayulita", storageApiKey: $bunny_sky, cdnHostname: "SkyhouseSayulita.b-cdn.net" },
                sayulita_shared: { storageZoneName: "sayulitaandbeyond", storageApiKey: $bunny_say, cdnHostname: "sayulitaandbeyond.b-cdn.net" },
                casasempreavanti: { storageZoneName: "villassempreavanti", storageApiKey: $bunny_csa, cdnHostname: "VillasSempreAvanti.b-cdn.net" }
              },
              telegram: { botToken: $tg_token, ownerChatId: "8609472348" },
              pexels: { apiKey: $pexels_key }
            }' > credentials.local.json
          echo "credentials.local.json created"

      - name: Run deploy script
        run: bash deploy-to-n8n.sh
