name: Deploy All Fullyo Workflows to n8n

on:
  workflow_dispatch:
  push:
    branches:
      - claude/n8n-social-media-automation-XpSkG

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build credentials file from secrets
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          FB_TOKEN_SKYHOUSE: ${{ secrets.FB_TOKEN_SKYHOUSE }}
          FB_TOKEN_CASASEMPREAVANTI: ${{ secrets.FB_TOKEN_CASASEMPREAVANTI }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUNNY_SKYHOUSE_KEY: ${{ secrets.BUNNY_SKYHOUSE_KEY }}
          BUNNY_SAYULITA_KEY: ${{ secrets.BUNNY_SAYULITA_KEY }}
          BUNNY_SEMPREAVANTI_KEY: ${{ secrets.BUNNY_SEMPREAVANTI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          # FB tokens for all pages are already in the committed credentials.local.json.
          # Only inject secrets that change per environment (Bunny keys, n8n key, etc).
          FB_MP=$(jq -r '.facebook.pages.moroccan_palace.accessToken' credentials.local.json)
          FB_LUX=$(jq -r '.facebook.pages.lux_property_management.accessToken' credentials.local.json)

          jq \
            --arg n8n_key "$N8N_API_KEY" \
            --arg fb_sky "$FB_TOKEN_SKYHOUSE" \
            --arg fb_vsa "$FB_TOKEN_CASASEMPREAVANTI" \
            --arg fb_mp "$FB_MP" \
            --arg fb_lux "$FB_LUX" \
            --arg anthropic_key "$ANTHROPIC_API_KEY" \
            --arg bunny_sky "$BUNNY_SKYHOUSE_KEY" \
            --arg bunny_say "$BUNNY_SAYULITA_KEY" \
            --arg bunny_csa "$BUNNY_SEMPREAVANTI_KEY" \
            --arg tg_token "$TELEGRAM_BOT_TOKEN" \
            --arg pexels_key "$PEXELS_API_KEY" \
            '.n8n.apiKey = $n8n_key
             | .facebook.pages.skyhouse_sayulita.accessToken = $fb_sky
             | .facebook.pages.casasempreavanti.accessToken = $fb_vsa
             | .facebook.pages.moroccan_palace.accessToken = $fb_mp
             | .facebook.pages.lux_property_management.accessToken = $fb_lux
             | .anthropic.apiKey = $anthropic_key
             | .bunny.skyhouse.storageApiKey = $bunny_sky
             | .bunny.sayulita_shared.storageApiKey = $bunny_say
             | .bunny.casasempreavanti.storageApiKey = $bunny_csa
             | .telegram.botToken = $tg_token
             | .pexels.apiKey = $pexels_key' \
            credentials.local.json > credentials.tmp.json && \
          mv credentials.tmp.json credentials.local.json
          echo "credentials.local.json updated"

      - name: Run deploy script
        run: bash deploy-to-n8n.sh
