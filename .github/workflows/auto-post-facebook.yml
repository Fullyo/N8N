name: Auto Post to Facebook

on:
  push:
    branches:
      - claude/n8n-social-media-automation-XpSkG
    paths:
      - 'pending-post.json'

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check pending post has content
        id: check
        run: |
          CAPTION=$(jq -r '.caption' pending-post.json)
          FOLDER=$(jq -r '.photo_folder' pending-post.json)
          if [ -z "$CAPTION" ] || [ "$CAPTION" = "null" ] || [ -z "$FOLDER" ] || [ "$FOLDER" = "null" ]; then
            echo "pending-post.json is empty — nothing to post"
            echo "has_content=false" >> $GITHUB_OUTPUT
          else
            echo "Posting: ${CAPTION:0:60}..."
            echo "Folder: $FOLDER"
            echo "has_content=true" >> $GITHUB_OUTPUT
          fi

      - name: Build credentials file
        if: steps.check.outputs.has_content == 'true'
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          FB_TOKEN_SKYHOUSE: ${{ secrets.FB_TOKEN_SKYHOUSE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUNNY_SKYHOUSE_KEY: ${{ secrets.BUNNY_SKYHOUSE_KEY }}
          BUNNY_SAYULITA_KEY: ${{ secrets.BUNNY_SAYULITA_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          jq -n \
            --arg n8n_key "$N8N_API_KEY" \
            --arg fb_token "$FB_TOKEN_SKYHOUSE" \
            --arg anthropic_key "$ANTHROPIC_API_KEY" \
            --arg bunny_sky "$BUNNY_SKYHOUSE_KEY" \
            --arg bunny_say "$BUNNY_SAYULITA_KEY" \
            --arg tg_token "$TELEGRAM_BOT_TOKEN" \
            --arg pexels_key "$PEXELS_API_KEY" \
            '{
              facebook: {
                appId: "812551218572821",
                pages: {
                  skyhouse_sayulita: {
                    pageId: "1004908006045909",
                    accessToken: $fb_token
                  }
                }
              },
              n8n: { instanceUrl: "https://fullyo.app.n8n.cloud", apiKey: $n8n_key },
              anthropic: { apiKey: $anthropic_key },
              bunny: {
                storageRegionHostname: "la.storage.bunnycdn.com",
                skyhouse: {
                  storageZoneName: "skyhousesayulita",
                  storageApiKey: $bunny_sky,
                  cdnHostname: "SkyhouseSayulita.b-cdn.net"
                },
                sayulita_shared: {
                  storageZoneName: "sayulitaandbeyond",
                  storageApiKey: $bunny_say,
                  cdnHostname: "sayulitaandbeyond.b-cdn.net"
                }
              },
              telegram: { botToken: $tg_token, ownerChatId: "8609472348" },
              pexels: { apiKey: $pexels_key }
            }' > credentials.local.json

      - name: Post to Facebook
        if: steps.check.outputs.has_content == 'true'
        run: |
          bash post-to-facebook.sh 2>&1 | tee _post-debug-skyhouse.log
          EXIT=${PIPESTATUS[0]}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _post-debug-skyhouse.log
          git commit -m "debug: skyhouse post output" || true
          git push origin HEAD:claude/n8n-social-media-automation-XpSkG || true
          exit $EXIT

      - name: Clear pending post
        if: steps.check.outputs.has_content == 'true'
        run: |
          jq -n '{"caption": "", "photo_folder": "", "num_photos": 3}' > pending-post.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pending-post.json
          git commit -m "clear: post published to Facebook"
          git push origin HEAD:claude/n8n-social-media-automation-XpSkG
