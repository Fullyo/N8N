name: Diag MP Bunny

on:
  workflow_dispatch:
  push:
    branches:
      - claude/n8n-social-media-automation-XpSkG
    paths:
      - '_diag-mp-bunny-trigger.txt'

jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: List MP Bunny zone
        env:
          BUNNY_MOROCCANPALACE_KEY: ${{ secrets.BUNNY_MOROCCANPALACE_KEY }}
        run: |
          set +e
          FROM_FILE=$(jq -r '.bunny.themoroccanpalace.storageApiKey // empty' fb-tokens.json)
          KEY="${BUNNY_MOROCCANPALACE_KEY:-$FROM_FILE}"
          {
            echo "=== KEY_LEN ==="
            echo "secret_len=${#BUNNY_MOROCCANPALACE_KEY}"
            echo "from_file_len=${#FROM_FILE}"
            echo "effective_len=${#KEY}"
            for BASE in "https://la.storage.bunnycdn.com/themoroccanpalace" "https://storage.bunnycdn.com/themoroccanpalace"; do
              echo ""
              echo "#### BASE=$BASE"
              echo "=== ROOT ==="
              RESP=$(curl -s -H "AccessKey: $KEY" "$BASE/")
              echo "$RESP" | head -c 400; echo
              for folder in Pool Rooftop Riad Interiors Glamping Villa "La Ventana"; do
                ENC="${folder// /%20}"
                echo "=== /$folder/ ==="
                curl -s -H "AccessKey: $KEY" "$BASE/$ENC/" | head -c 400; echo
              done
            done
          } > _mp-bunny-listing.txt 2>&1
          cat _mp-bunny-listing.txt
          exit 0
      - name: Commit listing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _mp-bunny-listing.txt
          git commit -m "diag: MP Bunny zone listing" || echo "no changes"
          git push origin HEAD:claude/n8n-social-media-automation-XpSkG
