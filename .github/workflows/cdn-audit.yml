name: CDN Audit All Properties

on:
  workflow_dispatch:
  push:
    branches:
      - claude/n8n-social-media-automation-XpSkG
    paths:
      - '_cdn-audit-trigger.txt'

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Read MP Bunny key from fb-tokens.json
        id: mp_key
        run: |
          MP_KEY=$(jq -r '.bunny.themoroccanpalace.storageApiKey // empty' fb-tokens.json)
          echo "mp_key=$MP_KEY" >> $GITHUB_OUTPUT

      - name: Audit all Bunny CDN zones
        env:
          BUNNY_SKYHOUSE_KEY: ${{ secrets.BUNNY_SKYHOUSE_KEY }}
          BUNNY_SAYULITA_KEY: ${{ secrets.BUNNY_SAYULITA_KEY }}
          BUNNY_SEMPREAVANTI_KEY: ${{ secrets.BUNNY_SEMPREAVANTI_KEY }}
          BUNNY_MOROCCANPALACE_KEY: ${{ secrets.BUNNY_MOROCCANPALACE_KEY || steps.mp_key.outputs.mp_key }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, urllib.parse

          BASE = "https://la.storage.bunnycdn.com"
          TG_CHAT = "8609472348"
          TG_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN", "")

          def list_folder(zone, key, path=""):
              url = f"{BASE}/{zone}/{urllib.parse.quote(path, safe='/')}/"
              req = urllib.request.Request(url, headers={"AccessKey": key})
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      return json.loads(r.read())
              except Exception as e:
                  return []

          def count_photos(items):
              exts = {'.jpg','.jpeg','.png','.webp','.gif','.JPG','.JPEG','.PNG'}
              return len([x for x in items if not x.get('IsDirectory') and
                         any(x.get('ObjectName','').endswith(e) for e in exts)])

          def count_videos(items):
              exts = {'.mp4','.mov','.avi','.MP4','.MOV'}
              return len([x for x in items if not x.get('IsDirectory') and
                         any(x.get('ObjectName','').endswith(e) for e in exts)])

          SKY_KEY  = os.environ.get("BUNNY_SKYHOUSE_KEY","")
          SAY_KEY  = os.environ.get("BUNNY_SAYULITA_KEY","")
          VSA_KEY  = os.environ.get("BUNNY_SEMPREAVANTI_KEY","")
          MP_KEY   = os.environ.get("BUNNY_MOROCCANPALACE_KEY","")

          lines = []
          missing = []
          ok = []

          def section(title):
              lines.append("")
              lines.append(f"=== {title} ===")

          def check(label, zone, key, path=""):
              items = list_folder(zone, key, path)
              photos = count_photos(items)
              videos = count_videos(items)
              subdirs = [x['ObjectName'] for x in items if x.get('IsDirectory')]
              if photos == 0 and videos == 0:
                  lines.append(f"  EMPTY  {label}")
                  missing.append(label)
              else:
                  detail = f"{photos} photos"
                  if videos: detail += f", {videos} videos"
                  if subdirs: detail += f" | subdirs: {', '.join(subdirs)}"
                  lines.append(f"  OK     {label}: {detail}")
                  ok.append(f"{label}: {detail}")
              return items

          # SKYHOUSESAYULITA
          section("SKYHOUSESAYULITA — SkyHouse property")
          items = check("SkyHouse root", "skyhousesayulita", SKY_KEY, "")
          subdirs = [x['ObjectName'] for x in items if x.get('IsDirectory')]
          for d in subdirs:
              check(f"SkyHouse/{d}", "skyhousesayulita", SKY_KEY, d)

          # SAYULITAANDBEYOND
          section("SAYULITAANDBEYOND — Shared activity photos")
          for folder in ["Surf","Yoga","Restaurants","Marieta Islands","Monkey Mountain",
                         "Golf","Fishing Charter","Whale Tours","SUP","Ally Cat","CachaSol","Local Cultural"]:
              check(folder, "sayulitaandbeyond", SAY_KEY, folder)

          # VILLASSEMPREAVANTI
          section("VILLASSEMPREAVANTI — VSA property photos")
          for folder in ["Villa Luisa","Villa Pietro","Villas Sempre Avanti"]:
              check(folder, "villassempreavanti", VSA_KEY, folder)

          # THEMOROCCANPALACE
          section("THEMOROCCANPALACE — MP property + La Ventana")
          for folder in ["Pool","Rooftop","Riad","Interiors","Glamping","Villa"]:
              check(folder, "themoroccanpalace", MP_KEY, folder)
          for sub in ["Diving","Kite Surfing","Whale Sharks","Sea Lions"]:
              check(f"La Ventana/{sub}", "themoroccanpalace", MP_KEY, f"La Ventana/{sub}")

          # Summary
          lines.insert(0, f"CDN AUDIT — {__import__('datetime').datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')}")
          lines.append("")
          lines.append(f"SUMMARY: {len(ok)} folders OK, {len(missing)} EMPTY")
          if missing:
              lines.append("EMPTY FOLDERS:")
              for m in missing:
                  lines.append(f"  - {m}")

          report = "\n".join(lines)
          print(report)

          with open("_cdn-audit.txt", "w") as f:
              f.write(report)

          # Telegram summary
          if TG_TOKEN:
              status = "All folders have photos" if not missing else f"{len(missing)} empty folders"
              tg_lines = [f"CDN Audit Complete"]
              tg_lines += [f"OK: {x}" for x in ok[:15]]
              if missing:
                  tg_lines += [f"EMPTY: {m}" for m in missing]
              msg = "\n".join(tg_lines)
              data = urllib.parse.urlencode({"chat_id": TG_CHAT, "text": msg}).encode()
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{TG_TOKEN}/sendMessage", data=data)
              try:
                  urllib.request.urlopen(req, timeout=10)
              except:
                  pass
          PYEOF

      - name: Commit audit results
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add _cdn-audit.txt
          git diff --staged --quiet || git commit -m "audit: CDN photo inventory $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
