name: Full CDN Audit — All Properties

on:
  workflow_dispatch:
  push:
    branches:
      - claude/n8n-social-media-automation-XpSkG
    paths:
      - '_cdn-audit-trigger.txt'

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Audit all Bunny CDN zones
        env:
          BUNNY_SKYHOUSE_KEY: ${{ secrets.BUNNY_SKYHOUSE_KEY }}
          BUNNY_SAYULITA_KEY: ${{ secrets.BUNNY_SAYULITA_KEY }}
          BUNNY_SEMPREAVANTI_KEY: ${{ secrets.BUNNY_SEMPREAVANTI_KEY }}
          BUNNY_MOROCCANPALACE_KEY: ${{ secrets.BUNNY_MOROCCANPALACE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          BASE="https://la.storage.bunnycdn.com"
          TG_CHAT="8609472348"
          OUT="_cdn-audit.txt"

          list_folder() {
            local zone="$1" key="$2" path="$3"
            curl -sf -H "AccessKey: $key" "$BASE/$zone/$path" 2>/dev/null || echo "[]"
          }

          count_photos() {
            echo "$1" | python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          if isinstance(data,list):
              imgs=[x for x in data if not x.get('IsDirectory',False) and x.get('ObjectName','').lower().split('.')[-1] in ['jpg','jpeg','png','webp','gif']]
              print(len(imgs))
          else:
              print(0)"
          }

          {
          echo "============================================"
          echo "FULLYO CDN AUDIT — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "============================================"

          # ── SKYHOUSE SAYULITA ─────────────────────────
          echo ""
          echo "=== SKYHOUSESAYULITA (SkyHouse property photos) ==="
          SKY_ROOT=$(list_folder "skyhousesayulita" "$BUNNY_SKYHOUSE_KEY" "")
          SKY_COUNT=$(count_photos "$SKY_ROOT")
          echo "  Root folder: $SKY_COUNT photos"
          # List subdirs
          echo "$SKY_ROOT" | python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          if isinstance(data,list):
              dirs=[x['ObjectName'] for x in data if x.get('IsDirectory')]
              if dirs: print('  Subdirs: '+', '.join(dirs))
          " 2>/dev/null

          # ── SAYULITA SHARED (activity photos) ─────────
          echo ""
          echo "=== SAYULITAANDBEYOND (Shared activity photos) ==="
          FOLDERS="Surf Yoga Restaurants Marieta\ Islands Monkey\ Mountain Golf Fishing\ Charter Whale\ Tours SUP Ally\ Cat CachaSol Local\ Cultural"
          for FOLDER in "Surf" "Yoga" "Restaurants" "Marieta Islands" "Monkey Mountain" "Golf" "Fishing Charter" "Whale Tours" "SUP" "Ally Cat" "CachaSol" "Local Cultural"; do
            ENCODED=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$FOLDER'))")
            DATA=$(list_folder "sayulitaandbeyond" "$BUNNY_SAYULITA_KEY" "$ENCODED/")
            COUNT=$(count_photos "$DATA")
            if [ "$COUNT" -eq 0 ]; then
              echo "  ⚠ $FOLDER: EMPTY"
            else
              echo "  ✓ $FOLDER: $COUNT photos"
            fi
          done

          # ── VILLAS SEMPRE AVANTI ──────────────────────
          echo ""
          echo "=== VILLASSEMPREAVANTI (VSA property photos) ==="
          for FOLDER in "Villa Luisa" "Villa Pietro" "Villas Sempre Avanti"; do
            ENCODED=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$FOLDER'))")
            DATA=$(list_folder "villassempreavanti" "$BUNNY_SEMPREAVANTI_KEY" "$ENCODED/")
            COUNT=$(count_photos "$DATA")
            if [ "$COUNT" -eq 0 ]; then
              echo "  ⚠ $FOLDER: EMPTY"
            else
              echo "  ✓ $FOLDER: $COUNT photos"
            fi
          done

          # ── THE MOROCCAN PALACE ───────────────────────
          echo ""
          echo "=== THEMOROCCANPALACE (MP property + La Ventana activity photos) ==="
          MP_ROOT=$(list_folder "themoroccanpalace" "$BUNNY_MOROCCANPALACE_KEY" "")
          echo "$MP_ROOT" | python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          if isinstance(data,list):
              for x in data:
                  print('  ' + ('📁' if x.get('IsDirectory') else '🖼') + ' ' + x.get('ObjectName',''))
          " 2>/dev/null

          for FOLDER in "Pool" "Rooftop" "Riad" "Interiors" "Glamping" "Villa"; do
            DATA=$(list_folder "themoroccanpalace" "$BUNNY_MOROCCANPALACE_KEY" "$FOLDER/")
            COUNT=$(count_photos "$DATA")
            if [ "$COUNT" -eq 0 ]; then
              echo "  ⚠ $FOLDER/: EMPTY"
            else
              echo "  ✓ $FOLDER/: $COUNT photos"
            fi
          done

          # La Ventana activity subfolders
          LV=$(list_folder "themoroccanpalace" "$BUNNY_MOROCCANPALACE_KEY" "La%20Ventana/")
          echo ""
          echo "  La Ventana subfolders:"
          echo "$LV" | python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          if isinstance(data,list):
              for x in data:
                  print('    ' + ('📁' if x.get('IsDirectory') else '  ') + ' ' + x.get('ObjectName','?'))
          " 2>/dev/null

          for SUBFOLDER in "Diving" "Kite Surfing" "Whale Sharks" "Sea Lions"; do
            ENCODED=$(python3 -c "import urllib.parse; print(urllib.parse.quote('La Ventana/$SUBFOLDER'))")
            DATA=$(list_folder "themoroccanpalace" "$BUNNY_MOROCCANPALACE_KEY" "$ENCODED/")
            COUNT=$(count_photos "$DATA")
            if [ "$COUNT" -eq 0 ]; then
              echo "  ⚠ La Ventana/$SUBFOLDER/: EMPTY"
            else
              echo "  ✓ La Ventana/$SUBFOLDER/: $COUNT photos"
            fi
          done

          echo ""
          echo "============================================"
          echo "AUDIT COMPLETE"
          echo "============================================"
          } > "$OUT"

          cat "$OUT"

          # Send summary to Telegram
          SUMMARY=$(cat "$OUT" | grep -E "(EMPTY|✓|===)" | head -40 | sed 's/[&<>]//g')
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=📦 *CDN Audit Complete*

$(cat "$OUT" | grep -E '(⚠|✓)' | head -30)" > /dev/null

      - name: Commit audit results
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add _cdn-audit.txt
          git diff --staged --quiet || git commit -m "audit: CDN photo inventory $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
