name: Diagnose n8n

on:
  workflow_dispatch:
  push:
    branches:
      - claude/n8n-social-media-automation-XpSkG
    paths:
      - '_diag-n8n-trigger.txt'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Query n8n workflows and recent executions
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          BASE="https://fullyo.app.n8n.cloud/api/v1"

          {
            echo "=== WORKFLOWS ==="
            curl -s -H "X-N8N-API-KEY: $N8N_API_KEY" "$BASE/workflows?limit=30" \
              | jq '.data[] | {id, name, active, updatedAt}'

            echo ""
            echo "=== RECENT EXECUTIONS (last 30) ==="
            curl -s -H "X-N8N-API-KEY: $N8N_API_KEY" "$BASE/executions?limit=30&includeData=false" \
              | jq '.data[] | {id, workflowId, finished, mode, status, startedAt, stoppedAt}'

            echo ""
            echo "=== FAILED EXECUTIONS (last 15) ==="
            curl -s -H "X-N8N-API-KEY: $N8N_API_KEY" "$BASE/executions?status=error&limit=15&includeData=true" \
              | jq '.data[] | {id, workflowId, finished, mode, status, startedAt, errorMessage: (.data.resultData.error.message // ""), errorNode: (.data.resultData.error.node.name // "")}'
          } > _n8n-diagnostic.txt 2>&1

          cat _n8n-diagnostic.txt

      - name: Commit diagnostic output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _n8n-diagnostic.txt
          git commit -m "diag: n8n status snapshot" || echo "no changes"
          git push origin HEAD:claude/n8n-social-media-automation-XpSkG
